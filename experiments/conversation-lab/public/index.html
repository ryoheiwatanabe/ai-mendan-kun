<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>改修前の比較テスト（Aモード）</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>改修前の比較テスト</h1>
  <p id="config-line" class="note">読み込み中…</p>
  <p class="note">ローカル専用の画面です。外部公開しません。APIキーはサーバー側にだけ置き、ブラウザへ渡しません。</p>
</header>

<section>
  <h2>設定</h2>
  <div class="row">
    <label>モード <select id="mode"></select></label>
    <label>モデル <input id="model" size="22"></label>
    <label>temperature <input id="temperature" type="number" step="0.1" min="0" max="2" value="0" size="4"></label>
    <label>max_tokens <input id="max-tokens" type="number" min="64" max="8192" value="2048" size="6"></label>
    <label>タイムアウト(ms) <input id="timeout-ms" type="number" min="500" max="180000" value="60000" size="7"></label>
  </div>
  <div class="row">
    <button id="plan-button">計画を確認（送信しない）</button>
    <button id="run-button" class="primary">実行</button>
    <button id="abort-button" disabled>中止</button>
    <span id="run-status" class="note"></span>
  </div>
  <div class="row">
    <button id="select-all">全選択</button>
    <button id="select-none">全解除</button>
    <span id="case-count" class="note"></span>
  </div>
</section>

<section id="plan-box" hidden>
  <h2>実行予定</h2>
  <p id="plan-summary" class="note"></p>
  <table>
    <thead><tr><th>ケース</th><th>送信する根拠</th><th>除外した根拠</th><th>履歴</th><th>質問</th><th>API</th></tr></thead>
    <tbody id="plan-body"></tbody>
  </table>
</section>

<section>
  <h2>ケース（質問と根拠は書き換えできます）</h2>
  <div id="case-list"></div>
</section>

<section id="results" hidden>
  <h2>結果</h2>
  <div id="result-list"></div>
</section>

<section>
  <h2>実行記録</h2>
  <div class="row">
    <button id="reload-records">最新を読み込む</button>
    <a id="export-link" href="/api/export">JSONLを書き出す（非公開）</a>
  </div>
  <p id="records-summary" class="note"></p>
  <div id="records-list"></div>
</section>

<script src="/app.js"></script>
</body>
</html>
